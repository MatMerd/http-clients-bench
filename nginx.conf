worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    upstream httpbin {
        least_conn;
        server httpbin:8080;
        keepalive 64;
    }

    # HTTP/1.1
    server {
        listen 8888;
        server_name httpbin.local;

        location / {
            proxy_pass http://httpbin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }

    # HTTPS with HTTP/2
    server {
        listen 4443 ssl;
        http2 on;
        server_name httpbin.local;

        ssl_certificate /etc/nginx/certs/httpbin.local.crt;
        ssl_certificate_key /etc/nginx/certs/httpbin.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://httpbin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
