[project]
name = "bench-req"
version = "0.1.0"
description = "HTTP clients benchmarking suite comparing requests, httpx, aiohttp, and niquests performance"
readme = "README.md"
authors = [
    { name = "vffuunnyy", email = "vffuunnyy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.12.13",
    "niquests==3.14.1",
    "httpx[http2]==0.28.1",
    "httpcore==1.0.9",
]

[project.scripts]
bench-req = "bench_req:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
