[project]
name = "bench-req"
version = "0.1.0"
description = "HTTP clients benchmarking suite comparing requests, httpx, aiohttp, and niquests performance"
readme = "README.md"
authors = [
    { name = "vffuunnyy", email = "vffuunnyy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.1",
    "httpcore>=1.0.9",
    "httpx[http2]>=0.28.1",
    "impit>=0.7.3",
    "niquests>=3.15.2",
    "primp>=0.15.0",
    "rnet==3.0.0rc9",
]

[project.scripts]
bench-req = "bench_req:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
