services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "4443:4443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - httpbin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/get"]
      interval: 3s
      timeout: 3s
      retries: 10

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    restart: unless-stopped
    deploy:
      replicas: 6
